server:
  name: bobobeads-server
  mode: local
  grpc_port: 9090
  http_port: 8080
  # 留空时不信任 X-Forwarded-For，仅使用直连地址。
  trusted_proxy_cidrs: []

mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""
  dbname: bobobeads

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0

oss:
  # 阿里云 OSS：北京地域 pinto-test Bucket。密钥只放在 server.local.yaml。
  endpoint: https://oss-cn-beijing.aliyuncs.com
  region: cn-beijing
  bucket: pintoo
  # OSS CNAME 域名只用于 DNS 自定义域名绑定，不能直接访问。
  # 未配置自定义域名前，使用标准 Bucket 外网域名。
  public_base_url: https://img.appbobo.cn
  access_key_id: ""
  access_key_secret: ""



jwt:
  secret: "change-me-in-production"
  access_expire_h: 72
  refresh_expire_h: 720

sms:
  secret_id: ""
  secret_key: ""
  app_id: ""
  sign_name: "拼豆"
  template_id: ""

wechat:
  app_id: ""
  app_secret: ""
  mp_app_id: ""
  mp_secret: ""

apple:
  team_id: ""
  client_id: ""
  key_id: ""
  key_file: ""

log:
  level: debug
  path: ./logs
  max_size: 100
  max_age: 7

payment:
  wechat_pay:
    mch_id: ""
    api_key: ""
    cert_file: ""
    key_file: ""
    notify_url: ""

generation:
  daily_free_limit: 3
  credit_cost: 1
  expire_minutes: 30

pattern:
  max_width: 200
  max_height: 200
  max_pixels: 40000
  max_colors: 221

# 导出图纸水印 YAML 兜底：数据库 bb_config 未设置对应键时才使用。
# 使用 CDN 完整 URL；未配置有效 URL 时服务会安全关闭水印。
export_watermark:
  mode: none
  marketing_url: ""
  online_url: ""

ai_generation:
  task_expire_minutes: 30
  worker_interval: 30
  fake_provider: true
  provider_name: "fake"
  # 第三方不限并发，这里是我们自己的节流阀：先保守起步，按线上排队时延再上调。
  # 信号量是进程内的，多实例部署时需按实例数均分这个值。
  max_concurrency: 10
  dispatch_interval_ms: 2000
  dispatch_batch_size: 200
  # 生成约 30s，180s 留足 4K/high quality 的余量。
  # 约束链：单次尝试 180s < 卡死判定 15min < 任务过期 30min
  provider_timeout_sec: 180
  stuck_running_minutes: 15
  free_concurrent: 1
  free_queue_size: 3
  vip_concurrent: 2
  vip_queue_size: 10
  # api_key 不要写在这里，放到未提交的 conf/server.local.yaml
  vector_engine:
    base_url: "https://api.vectorengine.cn"
    api_key: ""
    model: "gpt-image-2"
    size: "512x512"
    quality: "medium"
    background: "auto"
    moderation: "auto"

# Flutter Web 管理后台。密码必须是 PBKDF2-SHA256 哈希，不能填写明文；
# 生产环境请通过独立的未提交配置或密钥管理系统注入 jwt_secret 和 accounts。
admin:
  jwt_secret: ""
  access_expire_m: 480
  accounts: []
