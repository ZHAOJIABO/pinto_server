server:
  name: bobobeads-server
  mode: prod
  # gRPC remains internal to the backend container. Only Nginx publishes HTTP.
  grpc_port: 9090
  http_port: 8080
  # 填写实际 Nginx / 负载均衡器的来源 CIDR；未配置时不会信任转发 IP 头。
  trusted_proxy_cidrs: []

mysql:
  host: mysql
  port: 3306
  user: bobobeads
  password: ""
  dbname: bobobeads

redis:
  host: redis
  port: 6379
  password: ""
  db: 0

oss:
  endpoint: https://oss-cn-beijing.aliyuncs.com
  region: cn-beijing
  bucket: pintoo
  public_base_url: https://img.appbobo.cn
  access_key_id: ""
  access_key_secret: ""

jwt:
  secret: ""
  access_expire_h: 72
  refresh_expire_h: 720

log:
  level: info
  path: /app/logs
  max_size: 100
  max_age: 7

generation:
  daily_free_limit: 3
  credit_cost: 1
  expire_minutes: 30

pattern:
  max_width: 200
  max_height: 200
  max_pixels: 40000
  max_colors: 221

# 用户投稿图纸的每日上限，防止刷投稿把审核队列淹掉。
template_submission:
  daily_limit: 5

# 导出图纸水印 YAML 兜底：数据库 bb_config 未设置对应键时才使用。
# 使用 CDN 完整 URL；未配置有效 URL 时服务会安全关闭水印。
export_watermark:
  mode: none
  marketing_url: ""
  online_url: ""

ai_generation:
  task_expire_minutes: 30
  worker_interval: 30
  fake_provider: false
  default_model: "gpt-image-2"
  # 用户主动重试用的模型：首发失败后换一家，避免同一个模型再失败一次。
  # 留空则重试沿用首发链条；可被 bb_config 的 ai_retry_model 覆盖。
  retry_model: "gemini-3-1-flash-image-preview"
  # 第三方不限并发，这里是我们自己的节流阀：先保守起步，按线上排队时延再上调。
  # 信号量是进程内的，多实例部署时需按实例数均分这个值。
  max_concurrency: 10
  dispatch_interval_ms: 2000
  dispatch_batch_size: 200
  provider_timeout_sec: 180
  # 只用来估算返回给客户端的 progress 百分比：第三方不回传真实进度。
  # 线上实际耗时变了就改这里，客户端不用发版。
  avg_duration_sec: 120
  stuck_running_minutes: 15
  free_concurrent: 1
  free_queue_size: 3
  vip_concurrent: 2
  vip_queue_size: 10
  # api_key 通过未提交的 conf/server.production.local.yaml 注入
  # 线上切换模型不需要改这里：给 bb_config 写一行 ai_active_model = <models 的 key>。
  models:
    gpt-image-2:
      adapter: openai_image_edit
      base_url: "https://api.vectorengine.cn"
      api_key: ""
      model: "gpt-image-2"
      options:
        size: "1024x1024"
        quality: "medium"
        background: "auto"
        moderation: "auto"
    gemini-3-1-flash-image-preview:
      adapter: gemini_generate_content
      base_url: "https://api.vectorengine.cn"
      api_key: ""
      model: "gemini-3.1-flash-image-preview"
      options:
        aspect_ratio: "1:1"
        image_size: "1K"

admin:
  jwt_secret: ""
  access_expire_m: 480
  accounts: []
