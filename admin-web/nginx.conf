server {
    listen 80;
    listen [::]:80;
    server_name appbobo.cn;

    # Keep the ACME path available for certificate diagnostics. Normal traffic
    # is redirected to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://appbobo.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name appbobo.cn;

    ssl_certificate     /etc/letsencrypt/live/appbobo.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/appbobo.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # The Flutter administrative portal and the API share an origin. This
    # avoids browser CORS requirements while keeping the backend unexposed.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Flutter Web uses client-side routing, so unknown application paths must
    # return its entry page instead of an Nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
